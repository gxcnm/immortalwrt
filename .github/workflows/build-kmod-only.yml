name: 360V6 9个kmod模块自动编译(apk格式)

on:
  workflow_dispatch:

jobs
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

      - name: 克隆 ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          path: openwrt

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置（360V6 + 只开9个模块 + apk格式）
        run: |
          cd openwrt
          cat > .config << EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_qihoo_360v6=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_MANAGER=apk
          CONFIG_APK_BUILD=y
          CONFIG_KERNEL_6_6=y

          CONFIG_PACKAGE_kmod-fuse=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_kmod-ipt-extra=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-ipt-nat6=y
          CONFIG_PACKAGE_kmod-ipt-physdev=y
          CONFIG_PACKAGE_kmod-nf-ipvs=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-ipt-fullconenat=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=n
          CONFIG_TARGET_ROOTFS_EXT4=n
          CONFIG_TARGET_ROOTFS_INITRAMFS=n
          CONFIG_ALL=n
          EOF

          make defconfig

      - name: 下载依赖
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: 编译内核模块（自动生成 apk）
        run: |
          cd openwrt
          make package/kernel/linux/compile -j$(nproc) V=s

      - name: 提取 9 个 .apk
        run: |
          mkdir -p modules
          cd openwrt
          find bin -name 'kmod-fuse*.apk' -o -name 'kmod-fs-btrfs*.apk' \
          -o -name 'kmod-ipt-extra*.apk' -o -name 'kmod-ipt-nat*.apk' \
          -o -name 'kmod-ipt-nat6*.apk' -o -name 'kmod-ipt-physdev*.apk' \
          -o -name 'kmod-nf-ipvs*.apk' -o -name 'kmod-veth*.apk' \
          -o -name 'kmod-ipt-fullconenat*.apk' | xargs -I {} cp {} ../modules/

      - name: 上传模块
        uses: actions/upload-artifact@v4
        with:
          name: 360V6-kmod-apk
          path: modules/
