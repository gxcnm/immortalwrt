name: Build 360V6 Modules (6.6.89) - APK

on:
  workflow_dispatch:  # 手动触发编译

env:
  # 精准匹配你路由器的源码&提交（内核6.6.89）
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  REPO_COMMIT: f9fbaa7017  # 从r34087-f9fbaa7017提取的核心提交ID
  TARGET_PLATFORM: qualcommax/ipq60xx
  MODULES_LIST: "kmod-fs-btrfs kmod-ipt-extra kmod-ipt-nat kmod-ipt-nat6 kmod-ipt-physdev kmod-nf-ipvs kmod-veth kmod-ipt-fullconenat kmod-fuse"
  KERNEL_VERSION: 6.6.89  # 显式声明内核版本
  TZ: Asia/Shanghai

jobs:
  build-modules:
    runs-on: ubuntu-24.04
    steps:
      - name: 检查服务器性能
        run: |
          echo "CPU核心数: $(nproc)"
          echo "内存信息:"
          free -h
          echo "磁盘信息:"
          df -hT

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update && sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget ccache curl \
            libelf-dev libncursesw5-dev swig pkg-config
          sudo timedatectl set-timezone "$TZ"

      - name: 克隆精准匹配的ImmortalWrt源码（内核6.6.89）
        run: |
          # 克隆指定分支 + 回滚到你路由器对应的提交ID
          git clone --depth=1 -b $REPO_BRANCH --single-branch $REPO_URL openwrt
          cd openwrt
          git reset --hard $REPO_COMMIT  # 强制回滚到匹配内核6.6.89的提交
          echo "OPENWRT_DIR=$(pwd)" >> $GITHUB_ENV
          # 校验内核版本（避免编译错版本）
          KERNEL_CHECK=$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' target/linux/generic/kernel-6.6)
          if [ "$KERNEL_CHECK" != "$KERNEL_VERSION" ]; then
            echo "错误：源码内核版本为 $KERNEL_CHECK，与目标 $KERNEL_VERSION 不匹配！"
            exit 1
          fi
          echo "✅ 源码内核版本校验通过：$KERNEL_VERSION"

      - name: 加载通用配置（复用General.config）
        run: |
          cd $OPENWRT_DIR
          # 拷贝通用配置（适配ARMv8优化、ccache等）
          cat > .config << EOF
          ### 通用配置（复用General.config核心项） ###
          CONFIG_DEVEL=y
          CONFIG_TARGET_OPTIONS=y
          CONFIG_TARGET_OPTIMIZATION="-O3 -pipe -march=armv8-a+crypto+crc -mcpu=cortex-a53+crypto+crc -mtune=cortex-a53"
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_default-settings=y
          CONFIG_PACKAGE_default-settings-chn=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_LUCI_LANG_zh_Hant=y
          # CONFIG_FEED_nss_packages is not set
          # CONFIG_FEED_sqm_scripts_nss is not set
          # CONFIG_TARGET_ROOTFS_INITRAMFS is not set

          ### 目标平台配置（360V6） ###
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_qihoo_360v6=y

          ### 要编译的模块（均为模块模式=m，生成APK） ###
          EOF
          
          # 追加目标模块配置
          for module in $MODULES_LIST; do
            echo "CONFIG_PACKAGE_${module}=m" >> .config
          done
          
          # 禁用不必要项，缩短编译时间
          echo "# CONFIG_TARGET_ROOTFS_TARGZ is not set" >> .config
          echo "# CONFIG_TARGET_ROOTFS_SQUASHFS is not set" >> .config
          echo "# CONFIG_BUILD_LOG is not set" >> .config
          echo "CONFIG_NOSSTRIP=y" >> .config

          # 生成最终配置
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 缓存工具链（加速二次编译）
        uses: actions/cache@v4.0.2  # 升级到最新稳定版
        with:
          key: qualcommax-ipq60xx-kernel-${{ env.KERNEL_VERSION }}-${{ env.REPO_COMMIT }}
          path: |
            ${{ env.OPENWRT_DIR }}/staging_dir
            ${{ env.OPENWRT_DIR }}/.ccache

      - name: 下载依赖包
        run: |
          cd $OPENWRT_DIR
          make download -j$(nproc)
          find dl -size -1024c -delete  # 清理无效下载文件

      - name: 编译指定内核模块（仅编译模块，不编译固件）
        run: |
          cd $OPENWRT_DIR
          # 先编译内核（保证模块依赖的内核头文件匹配）
          make package/linux/compile -j$(nproc) || make package/linux/compile -j1 V=s
          # 编译目标模块
          for module in $MODULES_LIST; do
            make package/$module/compile -j$(nproc) || make package/$module/compile -j1 V=s
          done

      - name: 整理APK产物（仅保留目标模块）
        run: |
          mkdir -p output-modules
          # 拷贝编译好的APK
          find $OPENWRT_DIR/bin/packages/ -name "kmod-*.apk" -exec cp {} output-modules/ \;
          # 过滤仅保留目标模块
          cd output-modules
          ls | grep -v -E "$(echo $MODULES_LIST | sed 's/ /|/g')" | xargs rm -f
          # 输出产物信息
          echo "✅ 编译完成的APK（内核${KERNEL_VERSION}）："
          ls -l
          # 校验APK架构（确保是ARMv8/aarch64）
          for apk in *.apk; do
            echo "🔍 校验 $apk 架构："
            file $apk | grep -i "aarch64" || echo "⚠ $apk 架构不匹配！"
          done

      - name: 上传APK产物
        uses: actions/upload-artifact@v4.3.4  # 核心修复：升级到v4+稳定版
        with:
          name: 360V6-Modules-Kernel${{ env.KERNEL_VERSION }}-${{ env.REPO_COMMIT }}
          path: output-modules/
          if-no-files-found: error  # 无APK文件时直接报错，便于排查问题
          retention-days: 90  # 产物保留90天，足够下载使用
