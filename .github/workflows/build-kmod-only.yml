name: 360V6 9个kmod模块编译(APK格式-完整工具链)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 安装系统基础工具（补全sed/awk等）
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl autoconf automake libtool pkg-config sed grep coreutils
          # 确保sed在系统路径（修复软链接缺失）
          sudo ln -s /bin/sed /usr/local/bin/sed
          sudo ln -s /bin/grep /usr/local/bin/grep

      - name: 2. 克隆ImmortalWrt源码（360V6适配版）
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-23.05  # 稳定分支，工具链完整
          path: openwrt
          fetch-depth: 1

      - name: 3. 初始化编译环境（完整工具链）
        run: |
          cd openwrt
          # 完整更新feeds（包括核心依赖）
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 预编译基础工具链（解决sed/lua依赖）
          make tools/compile -j$(nproc) V=s
          make toolchain/compile -j$(nproc) V=s

      - name: 4. 配置360V6 + APK格式 + 9个模块
        run: |
          cd openwrt
          # 加载360V6官方默认配置（完整内核规则）
          cp target/linux/qualcommax/ipq60xx/config-6.6 .config
          # 追加核心配置
          cat >> .config << EOF
          # 目标设备：360V6
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_qihoo_360v6=y
          # 强制APK包格式
          CONFIG_PACKAGE_MANAGER=apk
          CONFIG_APK_BUILD=y
          # 核心编译配置
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_KERNEL_PATCHVER=6.6
          # 9个内核模块（开启编译）
          CONFIG_PACKAGE_kmod-fuse=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_kmod-ipt-extra=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-ipt-nat6=y
          CONFIG_PACKAGE_kmod-ipt-physdev=y
          CONFIG_PACKAGE_kmod-nf-ipvs=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-ipt-fullconenat=y
          # 关闭固件打包（只保留模块）
          CONFIG_TARGET_ROOTFS_SQUASHFS=n
          CONFIG_TARGET_ROOTFS_EXT4=n
          CONFIG_ALL=n
          EOF
          # 生成最终配置
          make defconfig

      - name: 5. 下载所有依赖（包括lua等核心库）
        run: |
          cd openwrt
          make download -j$(nproc) V=s

      - name: 6. 编译内核模块（自动生成APK）
        run: |
          cd openwrt
          # 先编译lua解决依赖，再编译内核模块
          make package/utils/lua/compile -j$(nproc) V=s
          make package/kernel/linux/compile -j$(nproc) V=s

      - name: 7. 提取9个APK模块（只保留需要的）
        run: |
          mkdir -p ./360v6-kmod-apk
          cd openwrt
          # 筛选360V6适配的APK包（aarch64架构）
          find bin -name "kmod-fuse*aarch64_cortex-a53.apk" -exec cp {} ../360v6-kmod-apk/ \;
          find bin -name "kmod-fs-btrfs*aarch64_cortex-a53.apk" -exec cp {} ../360v6-kmod-apk/ \;
          find bin -name "kmod-ipt-extra*aarch64_cortex-a53.apk" -exec cp {} ../360v6-kmod-apk/ \;
          find bin -name "kmod-ipt-nat*aarch64_cortex-a53.apk" -exec cp {} ../360v6-kmod-apk/ \;
          find bin -name "kmod-ipt-nat6*aarch64_cortex-a53.apk" -exec cp {} ../360v6-kmod-apk/ \;
          find bin -name "kmod-ipt-physdev*aarch64_cortex-a53.apk" -exec cp {} ../360v6-kmod-apk/ \;
          find bin -name "kmod-nf-ipvs*aarch64_cortex-a53.apk" -exec cp {} ../360v6-kmod-apk/ \;
          find bin -name "kmod-veth*aarch64_cortex-a53.apk" -exec cp {} ../360v6-kmod-apk/ \;
          find bin -name "kmod-ipt-fullconenat*aarch64_cortex-a53.apk" -exec cp {} ../360v6-kmod-apk/ \;
          # 验证产物
          ls -l ../360v6-kmod-apk/

      - name: 8. 上传APK模块包
        uses: actions/upload-artifact@v4
        with:
          name: 360V6-kmod-6.6-apk
          path: ./360v6-kmod-apk/
          retention-days: 90
