name: 360V6-仅编译9个kmod模块(IPK)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  KMOD_LIST: "kmod-fuse kmod-fs-btrfs kmod-ipt-extra kmod-ipt-nat kmod-ipt-nat6 kmod-ipt-physdev kmod-nf-ipvs kmod-veth kmod-ipt-fullconenat"
  KERNEL_VERSION: 6.6.89

jobs:
  build-kmod:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 初始化环境（适配Ubuntu24.04）
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget curl autoconf automake libtool pkg-config device-tree-compiler
          sudo ln -s /usr/lib/python3/dist-packages/setuptools/_distutils /usr/lib/python3/dist-packages/distutils

      - name: 2. 克隆ImmortalWrt源码
        run: |
          git clone --depth=1 -b $REPO_BRANCH --single-branch $REPO_URL openwrt
          cd openwrt
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p kernel
          ./scripts/feeds install -a -p packages

      - name: 3. 配置360V6+6.6.89内核
        run: |
          cd $OPENWRT_PATH
          cat > .config << EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_qihoo_360v6=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_KERNEL_VERSION=$KERNEL_VERSION
          CONFIG_KERNEL_PATCHVER=6.6
          CONFIG_PACKAGE_kmod-fuse=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_kmod-ipt-extra=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-ipt-nat6=y
          CONFIG_PACKAGE_kmod-ipt-physdev=y
          CONFIG_PACKAGE_kmod-nf-ipvs=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-ipt-fullconenat=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=n
          CONFIG_ALL=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          EOF
          make defconfig

      - name: 4. 下载依赖
        run: |
          cd $OPENWRT_PATH
          make download -j$(nproc)

      - name: 5. 编译9个模块
        run: |
          cd $OPENWRT_PATH
          for KMOD in $KMOD_LIST; do
              make package/$KMOD/compile V=s -j$(nproc) || make package/$KMOD/compile V=s -j1
          done

      - name: 6. 整理IPK包
        run: |
          mkdir -p ./kmod-output
          for KMOD in $KMOD_LIST; do
              find $OPENWRT_PATH/bin -name "${KMOD}-${KERNEL_VERSION}*.ipk" -exec cp {} ./kmod-output/ \;
          done
          ls -l ./kmod-output/

      - name: 7. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 360V6-kmod-6.6.89
          path: ./kmod-output/
          retention-days: 90
